services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: vivola
      POSTGRES_PASSWORD: vivola
      POSTGRES_DB: vivola
    ports:
      - "5432:5432"
    volumes:
      - vivola-postgres-data:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql

volumes:
  vivola-postgres-data:
